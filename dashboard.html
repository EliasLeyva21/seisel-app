<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | SEISEL</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="assets/css/styles.css">

    <link rel="stylesheet" href="assets/css/dashboard.css">

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->

    <div id="sidebar"></div>

    <!-- CONTENIDO -->

    <main class="flex-grow-1">

        <!-- NAVBAR -->

        <div id="navbar"></div>

        <div class="container-fluid p-4">

            <h2 class="mb-4">

                Dashboard

            </h2>

            <!-- TARJETAS -->

            <div class="row g-4">

                <div class="col-lg-3 col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-buildings fs-1 text-primary"></i>

                            <h3 id="clientesTotal">

                                0

                            </h3>

                            <p class="mb-0">

                                Clientes

                            </p>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-fire fs-1 text-danger"></i>

                            <h3 id="equiposTotal">

                                0

                            </h3>

                            <p class="mb-0">

                                Equipos

                            </p>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-clipboard-check fs-1 text-success"></i>

                            <h3 id="inspeccionesTotal">

                                0

                            </h3>

                            <p class="mb-0">

                                Inspecciones

                            </p>

                        </div>

                    </div>

                </div>

                <div class="col-lg-3 col-md-6">

                    <div class="card shadow border-0">

                        <div class="card-body text-center">

                            <i class="bi bi-list-task fs-1 text-warning"></i>

                            <h3 id="ordenesTotal">

                                0

                            </h3>

                            <p class="mb-0">

                                Órdenes

                            </p>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ALERTAS -->

            <div class="row mt-4">

                <div class="col-lg-4">

                    <div class="card shadow border-0">

                        <div class="card-header bg-danger text-white">

                            Equipos Vencidos

                        </div>

                        <div class="card-body">

                            <h2 id="equiposVencidos">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card shadow border-0">

                        <div class="card-header bg-warning">

                            Próximos a Vencer

                        </div>

                        <div class="card-body">

                            <h2 id="equiposProximos">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

                <div class="col-lg-4">

                    <div class="card shadow border-0">

                        <div class="card-header bg-success text-white">

                            Operativos

                        </div>

                        <div class="card-body">

                            <h2 id="equiposOperativos">

                                0

                            </h2>

                        </div>

                    </div>

                </div>

            </div>

            <!-- GRÁFICOS -->

            <div class="row mt-4">

                <div class="col-lg-6">

                    <div class="card shadow border-0">

                        <div class="card-header">

                            Equipos por Tipo

                        </div>

                        <div class="card-body">

                            <canvas id="graficoEquipos"></canvas>

                        </div>

                    </div>

                </div>

                <div class="col-lg-6">

                    <div class="card shadow border-0">

                        <div class="card-header">

                            Órdenes por Estado

                        </div>

                        <div class="card-body">

                            <canvas id="graficoOrdenes"></canvas>

                        </div>

                    </div>

                </div>

            </div>

            <!-- ÚLTIMAS ÓRDENES -->

            <div class="row mt-4">

                <div class="col-12">

                    <div class="card shadow border-0">

                        <div class="card-header">

                            Últimas Órdenes Registradas

                        </div>

                        <div class="card-body">

                            <table class="table table-hover">

                                <thead>

                                    <tr>

                                        <th>Equipo</th>

                                        <th>Técnico</th>

                                        <th>Estado</th>

                                        <th>Fecha</th>

                                    </tr>

                                </thead>

                                <tbody id="tablaUltimasOrdenes">

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module" src="assets/js/dashboard.js"></script>

</body>

</html>
