<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Equipos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="../assets/css/styles.css">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">

Equipos Contra Incendios

</h2>

<div class="card shadow p-4">

<form id="equipoForm">

<input type="hidden" id="equipoId">

<div class="row g-3">

<div class="col-md-6">

<label>Cliente</label>

<select
id="cliente"
class="form-select"
required>

<option value="">Seleccione...</option>

</select>

</div>

<div class="col-md-6">

<label>Código</label>

<input
id="codigo"
class="form-control"
required>

</div>

<div class="col-md-6">

<label>Tipo</label>

<select
id="tipo"
class="form-select">

<option>Extintor</option>

<option>Gabinete</option>

<option>Manguera</option>

<option>Luz de emergencia</option>

</select>

</div>

<div class="col-md-6">

<label>Ubicación</label>

<input
id="ubicacion"
class="form-control">

</div>

<div class="col-md-4">

<label>Fecha instalación</label>

<input
type="date"
id="instalacion"
class="form-control">

</div>

<div class="col-md-4">

<label>Última recarga</label>

<input
type="date"
id="ultima"
class="form-control">

</div>

<div class="col-md-4">

<label>Próxima recarga</label>

<input
type="date"
id="proxima"
class="form-control">

</div>

<div class="col-md-6">

<label>Estado</label>

<select
id="estado"
class="form-select">

<option>Operativo</option>

<option>Próximo a vencer</option>

<option>Vencido</option>

</select>

</div>

<div class="col-12">

<button
class="btn btn-primary">

Guardar Equipo

</button>

<button
type="reset"
class="btn btn-secondary">

Limpiar

</button>

</div>

</div>

</form>

</div>

<hr>

<input
id="buscar"
class="form-control"
placeholder="Buscar equipo...">

<table class="table table-hover mt-3">

<thead class="table-dark">

<tr>

<th>Código</th>

<th>Cliente</th>

<th>Tipo</th>

<th>Estado</th>

<th width="170">

Acciones

</th>

</tr>

</thead>

<tbody id="tablaEquipos">

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module" src="../assets/js/equipos.js"></script>

</body>

</html>
