<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Equipos | SEISEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

<div class="d-flex">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar bg-primary text-white p-3" style="min-width: 250px; min-height: 100vh;">
        <div class="text-center py-4">
            <h3 class="fw-bold text-white">
                SEISEL
            </h3>
            <small class="text-white-50">
                Sistema de Gestión
            </small>
        </div>
        <hr class="text-white">

        <div class="nav flex-column">
            <a href="../dashboard.html" class="nav-link text-white py-2">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
            <a href="clientes.html" class="nav-link text-white py-2">
                <i class="bi bi-buildings me-2"></i> Clientes
            </a>
            <a href="equipos.html" class="nav-link text-white active fw-bold py-2 bg-dark bg-opacity-25 rounded">
                <i class="bi bi-fire me-2"></i> Equipos
            </a>
            <a href="inspecciones.html" class="nav-link text-white py-2">
                <i class="bi bi-clipboard-check me-2"></i> Inspecciones
            </a>
            <a href="ordenes.html" class="nav-link text-white py-2">
                <i class="bi bi-list-task me-2"></i> Órdenes
            </a>
        </div>
    </aside>

    <!-- ========================= -->
    <!-- CONTENIDO -->
    <!-- ========================= -->

    <main class="flex-grow-1">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="fw-bold">
                Sistema Web de Gestión del Mantenimiento Preventivo
            </span>
            <a href="../dashboard.html" class="btn btn-outline-primary">
                <i class="bi bi-house-door-fill"></i>
                Dashboard
            </a>
        </nav>

        <div class="container-fluid p-4">

            <!-- BREADCRUMB -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="../dashboard.html">
                            Dashboard
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Equipos
                    </li>
                </ol>
            </nav>

            <!-- ENCABEZADO Y BOTÓN VOLVER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    Equipos Contra Incendios
                </h2>
                <a href="../dashboard.html" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Volver al Dashboard
                </a>
            </div>

            <!-- FORMULARIO -->
            <div class="card shadow p-4">
                <form id="equipoForm">
                    <input type="hidden" id="equipoId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Cliente</label>
                            <select id="cliente" class="form-select" required>
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Código</label>
                            <input id="codigo" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Tipo</label>
                            <select id="tipo" class="form-select">
                                <option>Extintor</option>
                                <option>Gabinete</option>
                                <option>Manguera</option>
                                <option>Luz de emergencia</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Ubicación</label>
                            <input id="ubicacion" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Fecha instalación</label>
                            <input type="date" id="instalacion" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Última recarga</label>
                            <input type="date" id="ultima" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Próxima recarga</label>
                            <input type="date" id="proxima" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Estado</label>
                            <select id="estado" class="form-select">
                                <option>Operativo</option>
                                <option>Próximo a vencer</option>
                                <option>Vencido</option>
                            </select>
                        </div>
                        <div class="col-12 mt-4">
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-floppy"></i>
                                Guardar Equipo
                            </button>
                            <button type="reset" class="btn btn-secondary">
                                <i class="bi bi-eraser"></i>
                                Limpiar
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- BUSCADOR -->
            <div class="card shadow mt-4">
                <div class="card-body">
                    <input
                        id="buscar"
                        class="form-control"
                        placeholder="Buscar equipo por código, cliente o tipo...">
                </div>
            </div>

            <!-- TABLA -->
            <div class="card shadow mt-4">
                <div class="card-header bg-dark text-white">
                    Lista de Equipos
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Código</th>
                                    <th>Cliente</th>
                                    <th>Tipo</th>
                                    <th>Estado</th>
                                    <th width="170">
                                        Acciones
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="tablaEquipos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </main>

</div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../assets/js/equipos.js"></script>

</body>
</html>
