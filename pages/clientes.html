<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes | SEISEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>

<body>

<div class="d-flex">

    <!-- ========================= -->
    <!-- SIDEBAR CORREGIDO -->
    <!-- ========================= -->

    <aside class="sidebar bg-primary text-white p-3" style="min-width: 250px; min-height: 100vh;">
        <div class="text-center py-4">
            <h3 class="fw-bold text-white">
                SEISEL
            </h3>
            <small class="text-white-50">
                Sistema de Gestión
            </small>
        </div>
        <hr class="text-white">

        <div class="nav flex-column">
            <a href="../dashboard.html" class="nav-link text-white py-2">
                <i class="bi bi-speedometer2 me-2"></i> Dashboard
            </a>
            <a href="clientes.html" class="nav-link text-white active fw-bold py-2 bg-dark bg-opacity-25 rounded">
                <i class="bi bi-buildings me-2"></i> Clientes
            </a>
            <a href="equipos.html" class="nav-link text-white py-2">
                <i class="bi bi-fire me-2"></i> Equipos
            </a>
            <a href="inspecciones.html" class="nav-link text-white py-2">
                <i class="bi bi-clipboard-check me-2"></i> Inspecciones
            </a>
            <a href="ordenes.html" class="nav-link text-white py-2">
                <i class="bi bi-list-task me-2"></i> Órdenes
            </a>
        </div>
    </aside>

    <!-- ========================= -->
    <!-- CONTENIDO -->
    <!-- ========================= -->

    <main class="flex-grow-1">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm px-4">
            <span class="fw-bold">
                Sistema Web de Gestión del Mantenimiento Preventivo
            </span>
            <a href="../dashboard.html" class="btn btn-outline-primary">
                <i class="bi bi-house-door-fill"></i>
                Dashboard
            </a>
        </nav>

        <div class="container-fluid p-4">

            <!-- BREADCRUMB -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a href="../dashboard.html">
                            Dashboard
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        Clientes
                    </li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>
                    Gestión de Clientes
                </h2>
                <a href="../dashboard.html" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>
                    Volver al Dashboard
                </a>
            </div>

            <div class="card shadow p-4">
                <form id="clienteForm">
                    <input type="hidden" id="clienteId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input
                                id="razon_social"
                                class="form-control"
                                placeholder="Razón Social"
                                required>
                        </div>
                        <div class="col-md-6">
                            <input
                                id="ruc"
                                class="form-control"
                                maxlength="11"
                                placeholder="RUC">
                        </div>
                        <div class="col-md-6">
                            <input
                                id="direccion"
                                class="form-control"
                                placeholder="Dirección">
                        </div>
                        <div class="col-md-6">
                            <input
                                id="correo"
                                type="email"
                                class="form-control"
                                placeholder="Correo">
                        </div>
                        <div class="col-md-6">
                            <input
                                id="telefono"
                                class="form-control"
                                placeholder="Teléfono">
                        </div>
                        <div class="col-md-6">
                            <input
                                id="contacto"
                                class="form-control"
                                placeholder="Contacto">
                        </div>
                        <div class="col-12">
                            <button
                                class="btn btn-primary"
                                type="submit">
                                <i class="bi bi-floppy"></i>
                                Guardar Cliente
                            </button>
                            <button
                                class="btn btn-secondary"
                                type="reset">
                                <i class="bi bi-eraser"></i>
                                Limpiar
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- BUSCADOR -->
            <div class="card shadow mt-4">
                <div class="card-body">
                    <input
                        id="buscar"
                        class="form-control"
                        placeholder="Buscar cliente por razón social, RUC o correo...">
                </div>
            </div>

            <!-- TABLA -->
            <div class="card shadow mt-4">
                <div class="card-header bg-dark text-white">
                    Lista de Clientes
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover table-striped mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Razón Social</th>
                                    <th>RUC</th>
                                    <th>Correo</th>
                                    <th>Teléfono</th>
                                    <th width="180">
                                        Acciones
                                    </th>
                                </tr>
                            </thead>
                            <tbody id="tablaClientes">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>

    </main>

</div>

    <!-- ========================= -->
    <!-- SCRIPTS -->
    <!-- ========================= -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="module" src="../assets/js/clientes.js"></script>

</body>
</html>
