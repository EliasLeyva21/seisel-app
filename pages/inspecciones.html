<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Inspecciones</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<link rel="stylesheet" href="../assets/css/styles.css">

</head>

<body>

<div class="container mt-4">

<h2 class="mb-4">

Inspecciones

</h2>

<div class="card shadow p-4">

<form id="inspeccionForm">

<input type="hidden" id="inspeccionId">

<div class="row g-3">

<div class="col-md-6">

<label>Equipo</label>

<select

id="equipo"

class="form-select"

required>

<option value="">Seleccione...</option>

</select>

</div>

<div class="col-md-6">

<label>Estado</label>

<select

id="estado"

class="form-select">

<option>Operativo</option>

<option>Con observaciones</option>

<option>Fuera de servicio</option>

</select>

</div>

<div class="col-md-6">

<label>Presión</label>

<input

id="presion"

class="form-control"

placeholder="Ejemplo: 180 PSI">

</div>

<div class="col-md-6">

<label>Fecha</label>

<input

type="date"

id="fecha"

class="form-control">

</div>

<div class="col-12">

<label>Observaciones</label>

<textarea

id="observaciones"

rows="4"

class="form-control">

</textarea>

</div>

<div class="col-12">

<button class="btn btn-primary">

Guardar Inspección

</button>

<button

type="reset"

class="btn btn-secondary">

Limpiar

</button>

</div>

</div>

</form>

</div>

<hr>

<input

id="buscar"

class="form-control"

placeholder="Buscar inspección...">

<table class="table table-hover mt-3">

<thead class="table-dark">

<tr>

<th>Equipo</th>

<th>Estado</th>

<th>Presión</th>

<th>Fecha</th>

<th width="170">

Acciones

</th>

</tr>

</thead>

<tbody id="tablaInspecciones">

</tbody>

</table>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script type="module" src="../assets/js/inspecciones.js"></script>

</body>

</html>
